<html lang="en-US">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="author" content="madpang" />
<link rel="stylesheet" href="../../commons/styles/new-style.css" />
<link rel="icon" type="image/png" sizes="16x16" href="../../commons/images/favicon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="../../commons/images/favicon-32.png" />
<link rel="icon" type="image/png" sizes="64x64" href="../../commons/images/favicon-64.png" />
<title>
New CSS Debugging Page
</title>
</head>
<body
	class="pd-debug-border pd-flex-container pd-layout-col" >
<!-- @DIAGRAM
| ------------------------  HEADER BAR ------------------------------ |
| [96px icon] [<< ~~~  nav: link link link... ~~~  >>] [96px toggle ] |
| -------------------------- 100% width ----------------------------- |
-->
<header
	class="pd-h-96 pd-w-full pd-bg-color pd-flex-0 pd-z-1000 pd-flex-container pd-layout-row pd-center-y"
	aria-label="Page Header" >
<button
	id="btn-go-home"
	class="pd-btn pd-h-full pd-w-96 pd-asset-home-icon pd-flex-0"
	style="--pd-bg-color: blue;"
	aria-label="Go HomePage" >
</button>
<nav
	class="pd-h-full pd-inline-flex pd-flex-1"
	aria-label="Site Navigation" >
	<div class="pd-dummy pd-h-full pd-w-96 pd-flex-0" aria-hidden="true" ></div>
	<button
		id="btn-link-stack"
		class="pd-btn pd-h-full pd-asset-stack-label pd-flex-0"
		style="--pd-bg-img: url('../../commons/images/STACK-label.png'); --pd-width: 170px;"
		aria-label="STACK Link" >
	</button>
	<button
		id="btn-link-heap"
		class="pd-btn pd-h-full pd-asset-heap-label pd-flex-0"
		style="--pd-bg-img: url('../../commons/images/HEAP-label.png'); --pd-width: 140px;"
		aria-label="HEAP Link" >
	</button>
	<button
		id="btn-link-archive"
		class="pd-btn pd-h-full pd-asset-archive-label pd-flex-0"
		style="--pd-bg-img: url('../../commons/images/ARCHIVE-label.png'); --pd-width: 212px;"
		aria-label="ARCHIVE Link" >
	</button>
</nav>
<button
	id="btn-toggle-theme"
	class="pd-btn pd-h-full pd-w-96 pd-flex-0 pd-ml-auto"
	style="--pd-bg-img: url('../../commons/images/icon-switch-theme-light.png');"
	aria-label="Toggle Light/Dark Theme" >
</button>
</header>
<div
	class="pd-dummy pd-flex-1 pd-w-full"
	aria-hidden="true" >
<main
	class="pd-h-full pd-w-full pd-z-100 pd-grid pd-tri-cols" >
<div class="pd-dummy pd-h-full pd-w-full" aria-hidden="true" ></div>
<article>
<h1>Create a Custom CSS Debugging Page for Web Development</h1>
<p>This page is designed to help web developers debug and test CSS styles effectively.</p>
</article>
<div class="pd-dummy pd-h-full pd-w-full" aria-hidden="true" ></div>
</main>
<!-- @DIAGRAM
| ------------------------  FOOTER BAR ------------------------------ |
| [opt. grad.] [  --- fixed-width semi-trans. bar ---  ] [opt. grad.] |
| -------------------------- 100% width ----------------------------- |
-->
<footer
	class="pd-parent-anchor pd-anchor-b-0 pd-anchor-l-0 pd-h-32 pd-w-full pd-z-999 pd-grid pd-tri-cols pd-center-y"
	aria-label="Page Footer" >
	<div
		class="pd-h-full pd-w-full pd-bg-grad-x" >
	</div>
	<div
		class="pd-h-full pd-w-full pd-bg-color"
		style="--pd-bg-color: var(--color-frosted-glass);" >
	</div>
	<div
		class="pd-h-full pd-w-full pd-bg-grad-x pd-reverse-x" >
	</div>
</footer>
</div>
</body>
</html>
